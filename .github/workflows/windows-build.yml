name: Windows build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests (Windows, offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v --junitxml build/test-results.xml
      - name: Build exe (folder + single file)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/work packaging/RiskAscent.spec
          $env:RA_ONEFILE = "1"
          python -m PyInstaller --noconfirm --distpath dist --workpath build/work1 packaging/RiskAscent.spec
      - name: Self-test the packaged exe on Windows
        shell: pwsh
        run: |
          $p = Start-Process dist\RiskAscent.exe -ArgumentList "--self-test","--self-test-report","build\selftest_report.txt" -Wait -PassThru
          Get-Content build\selftest_report.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /DSRCDIR="$PWD\dist\RiskAscent" /DOUTFILE="$PWD\dist\RiskAscent_Setup.exe" packaging\RiskAscent.nsi
      - name: Silent install, self-test, uninstall
        shell: pwsh
        run: |
          Start-Process dist\RiskAscent_Setup.exe -ArgumentList "/S" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\RiskAscent\RiskAscent.exe"
          if (-not (Test-Path $exe)) { throw "Installer did not install $exe" }
          $p = Start-Process $exe -ArgumentList "--self-test","--self-test-report","build\installed_selftest.txt" -Wait -PassThru
          Get-Content build\installed_selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          Start-Process "$env:LOCALAPPDATA\Programs\RiskAscent\Uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw "Uninstaller left the program behind" }
      - name: Checksums
        shell: pwsh
        run: Get-FileHash dist\RiskAscent.exe, dist\RiskAscent_Setup.exe -Algorithm SHA256 | Format-List | Out-File build\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RiskAscent-windows
          path: |
            dist/RiskAscent.exe
            dist/RiskAscent_Setup.exe
            build/*.txt
            build/*.xml
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RiskAscent.exe
            dist/RiskAscent_Setup.exe
            build/SHA256SUMS.txt
